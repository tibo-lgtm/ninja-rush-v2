<!DOCTYPE html>
<html lang="fr">
<head>

<title>Ninja Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0b0d;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,6,8,.45),rgba(6,4,5,.78));z-index:5;padding:16px}
#ui.hide{display:none}
.card{width:min(440px,100%);background:linear-gradient(180deg,#241a1d,#110d0f);border:2px solid #5a1c1c;border-radius:22px;padding:26px 24px 22px;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.card h1{margin:0 0 8px;font-size:clamp(30px,8vw,46px);letter-spacing:2px;font-weight:900;color:#fff;text-shadow:0 3px 0 #9e1a14,0 6px 14px rgba(0,0,0,.6)}
.card .sub{margin:0 0 14px;color:#cdbfb4;font-size:15px;line-height:1.4}
#stats{margin:6px 0 14px;font-size:17px;color:#efe3d6;line-height:1.7}
#stats .big{font-size:42px;font-weight:900;color:#f0c060;letter-spacing:1px}
#stats .nb{color:#7cf29a;font-weight:800;margin-top:4px}
#btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:2px;color:#fff6e8;background:linear-gradient(180deg,#d8382c,#8f1414);border:2px solid #e8b04a;border-radius:12px;padding:13px 38px;cursor:pointer;box-shadow:0 5px 0 #4a0808,0 10px 24px rgba(0,0,0,.45);touch-action:manipulation;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a0808}
.ctl{margin:16px 0 0;color:#a8998f;font-size:13px;line-height:1.55}
#mute{position:fixed;left:12px;top:12px;z-index:6;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);color:#fff;font-size:20px;cursor:pointer;touch-action:manipulation;padding:0;line-height:1}
.card{max-height:100%;overflow-y:auto;touch-action:pan-y}
#heroCv{display:block;margin:0 auto 2px}
#heroName{font-weight:900;font-size:17px;color:#f0c060;letter-spacing:1px;margin-bottom:6px}
#wallet,#shopWal{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:18px;color:#fff;background:rgba(0,0,0,.35);border-radius:20px;padding:4px 14px;margin:0 0 14px}
.ci{position:relative;display:inline-block;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecd0a2,#b9844c 55%,#6e4422);box-shadow:0 0 0 1.5px rgba(94,56,24,.9) inset,0 1px 0 #3e2410}
.ci::after{content:'';position:absolute;left:50%;top:50%;width:28%;height:28%;transform:translate(-50%,-50%);background:#2a1a06;box-shadow:0 0 0 1px #8a5a2c}
.sec{display:block;margin:12px auto 0;font:inherit;font-weight:900;font-size:16px;letter-spacing:1px;color:#f4e6d0;background:linear-gradient(180deg,#3a3034,#1f191c);border:1px solid #7a2a24;border-radius:10px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 #0e0a0b;touch-action:manipulation}
.sec:active{transform:translateY(3px);box-shadow:0 1px 0 #0e0a0b}
#shop{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(8,5,6,.84);padding:12px}
#shop.hide{display:none}
#shop .panel{width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#241a1d,#110d0f);border:2px solid #5a1c1c;border-radius:22px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.shead h2{margin:0;font-size:22px;letter-spacing:2px;font-weight:900;text-shadow:0 2px 0 #9e1a14}
.shead #shopWal{margin:0}
#shopClose{font:inherit;font-weight:900;font-size:18px;width:40px;height:40px;border-radius:50%;border:0;background:#3a2a2c;color:#fff;cursor:pointer;flex:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:8px 14px 16px;overflow-y:auto;touch-action:pan-y}
.hc{background:rgba(255,255,255,.03);border:2px solid #3a2a2c;border-radius:16px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.hc.sel{border-color:#e8b04a;background:rgba(232,176,74,.08)}
.hc canvas{display:block}
.hn{font-weight:800;font-size:14px;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hb{font:inherit;font-weight:900;font-size:14px;border:0;border-radius:10px;padding:7px 10px;width:100%;cursor:pointer;color:#fff;background:#8f1a16;display:inline-flex;align-items:center;justify-content:center;gap:5px;touch-action:manipulation}
.hb.on{background:#3d6b45;cursor:default}
.hb.buy{background:linear-gradient(180deg,#f0c060,#c88a1e);color:#2a1400}
.hb.no{background:#2e2729;color:#8f8086}
.hb .ci{width:13px;height:13px}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;z-index:7;pointer-events:none}
.card.rec{border-color:#e8b04a;animation:glow 1.2s ease-in-out infinite alternate}
.card.rec h1{color:#f0c060;text-shadow:0 3px 0 #8a1a10,0 0 18px rgba(255,160,40,.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.card.rec #stats .big{animation:beat 1s ease-in-out infinite}
@keyframes glow{from{box-shadow:0 0 18px rgba(255,212,59,.35),0 20px 60px rgba(0,0,0,.55)}to{box-shadow:0 0 46px rgba(255,212,59,.75),0 20px 60px rgba(0,0,0,.55)}}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#shopRow{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#shopRow .sec{margin:0}
#sabreShopBtn{background:linear-gradient(180deg,#4a4850,#26242a);border-color:#8a8f9a;box-shadow:0 4px 0 #0e0a0b}
#tabs{display:flex;gap:8px;padding:4px 14px 6px}
#tabs button{flex:1;font:inherit;font-weight:900;font-size:14px;letter-spacing:1px;border:0;border-radius:10px;padding:9px;color:#a8998f;background:#2a2023;cursor:pointer;touch-action:manipulation}
#tabs button.on{color:#fff;background:#8f1a16}
.hi{font-size:12px;color:#cdbfb4;margin:-3px 0 6px}
.tip{grid-column:1/-1;margin:4px 0 0;color:#a8998f;font-size:13px;line-height:1.5;text-align:center}
#sabreBtn{--sg:#cfe8ff;position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));z-index:6;width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:radial-gradient(circle at 45% 35%,#3a2a2e,#100b0d 75%);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:none;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#sabreBtn .sw{font-size:30px;line-height:1}
#sabreBtn .sn{font-weight:900;font-size:15px;margin-top:2px}
#sabreBtn.on{border-color:var(--sg);box-shadow:0 0 0 4px var(--sg),0 0 30px var(--sg);animation:sabrePulse .35s ease-in-out infinite alternate}
#sabreBtn.empty{opacity:.4}
@keyframes sabrePulse{from{transform:scale(1)}to{transform:scale(1.08)}}
#hud{position:fixed;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
#err{position:fixed;left:0;right:0;top:40%;text-align:center;color:#fff;font-size:18px;z-index:20;display:none;padding:16px}
#mFull{position:absolute;top:calc(64px + env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));bottom:auto;font-size:13px;padding:9px 12px;background:linear-gradient(180deg,#3a3034,#1f191c);box-shadow:0 3px 0 #0e0a0b,0 6px 16px rgba(0,0,0,.35)}
#boostBtn{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));z-index:6;width:80px;height:80px;border-radius:50%;border:0;background:radial-gradient(circle at 45% 35%,#2a2226,#0d0a0c 72%);color:#fff;display:none;cursor:pointer;touch-action:none;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);font-family:inherit;transition:background .3s}
#boostBtn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#boostBtn .trk{fill:none;stroke:rgba(255,255,255,.12);stroke-width:5}
#boostBtn .prg{fill:none;stroke:url(#bgr);stroke-width:5;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset .25s linear}
#boostBtn .spn{fill:none;stroke:#ffd27a;stroke-width:1.6;stroke-dasharray:6 10;opacity:0;transform-origin:0 0}
#boostBtn .wnd{fill:none;stroke:#6f6a72;stroke-width:5;stroke-linecap:round;stroke-dasharray:22 9}
#boostBtn .krg{fill:none;stroke:#7d7a80;stroke-width:3.2}
#boostBtn .khd{fill:#5a1414}
#boostBtn .kwr{stroke:#c9a24a;stroke-width:1.6;fill:none}
#boostBtn .kbl{fill:#80838c}
#boostBtn .kri{stroke:rgba(255,255,255,.45);stroke-width:1.4}
#boostBtn .bn{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-weight:900;font-size:11px;letter-spacing:2px;color:#a9a3a8}
#boostBtn.ready{background:radial-gradient(circle at 45% 35%,#5c1612,#1a0807 75%);animation:bReady 1s ease-in-out infinite}
#boostBtn.ready .wnd{stroke:#ffd27a;animation:bWind .5s linear infinite}
#boostBtn.ready .kbl{fill:url(#bbl)} #boostBtn.ready .krg{stroke:#ffd27a} #boostBtn.ready .khd{fill:#b3121b}
#boostBtn.ready .bn{color:#ffe3a0}
#boostBtn.ready .spn{opacity:.8;animation:bSpin 3s linear infinite}
#boostBtn.on{background:radial-gradient(circle at 45% 35%,#e0431f,#6e0d0a 75%);box-shadow:0 0 0 3px rgba(255,210,122,.8),0 0 34px rgba(255,80,40,.75)}
#boostBtn.on .wnd{stroke:#fff3d0;animation:bWind .18s linear infinite}
#boostBtn.on .kbl{fill:#fff} #boostBtn.on .krg{stroke:#ffe3a0} #boostBtn.on .khd{fill:#2a0a08}
#boostBtn.on .bn{color:#fff}
#boostBtn.on .spn{opacity:1;stroke:#fff3d0;animation:bSpin .6s linear infinite}
#boostBtn.on .emb{filter:drop-shadow(0 0 4px #ffd27a)}
@keyframes bWind{to{stroke-dashoffset:-31}}
@keyframes bSpin{to{transform:rotate(360deg)}}
@keyframes bReady{0%,100%{transform:scale(1);box-shadow:0 0 0 2px rgba(255,210,122,.55),0 0 16px rgba(255,60,40,.45)}50%{transform:scale(1.07);box-shadow:0 0 0 3px rgba(255,210,122,.95),0 0 30px rgba(255,60,40,.8)}}
#menuBtn{background:linear-gradient(180deg,#3a3034,#1f191c);box-shadow:0 4px 0 #0e0a0b}
#menuUI{position:fixed;inset:0;z-index:5;pointer-events:none;color:#fff}
#menuUI.hide{display:none}
#menuUI button{pointer-events:auto;touch-action:manipulation}
#logo{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;font-weight:900;line-height:.92;letter-spacing:3px;font-size:clamp(38px,8.5vw,80px);color:#f7efe4;white-space:nowrap;text-shadow:0 3px 0 #a3150f,0 6px 0 #4a0806,0 12px 26px rgba(0,0,0,.65);animation:logoIn .8s cubic-bezier(.2,1.5,.4,1) both}
#logo span{display:block;color:#e9b04c;font-size:1.12em;text-shadow:0 3px 0 #8a3a0a,0 6px 0 #3a1404,0 12px 26px rgba(0,0,0,.65)}
@keyframes logoIn{0%{transform:translateX(-50%) scale(.3) rotate(-6deg);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#mTop{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:900;font-size:18px;background:rgba(12,8,10,.62);border:2px solid rgba(232,176,74,.35);border-radius:22px;padding:5px 14px}
#mBest{font-size:14px;color:#ffe9a8}
#mHero{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);font-weight:900;font-size:18px;color:#f0c060;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.6);white-space:nowrap}
#mPlay{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);font:inherit;font-weight:900;font-size:32px;letter-spacing:3px;color:#fff6e8;background:linear-gradient(180deg,#d8382c,#8f1414);border:3px solid #e8b04a;border-radius:16px;padding:12px 58px;box-shadow:0 6px 0 #4a0808,0 12px 30px rgba(0,0,0,.55);text-shadow:0 2px 0 rgba(0,0,0,.35);cursor:pointer;animation:playPulse 1.1s ease-in-out infinite}
#mPlay:active{box-shadow:0 2px 0 #4a0808}
@keyframes playPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
.mBtn{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));font:inherit;font-weight:900;font-size:15px;letter-spacing:1px;color:#f4e6d0;border:1px solid #7a2a24;border-radius:12px;padding:12px 18px;background:linear-gradient(180deg,#3a3034,#1f191c);box-shadow:0 4px 0 #0e0a0b,0 8px 20px rgba(0,0,0,.4);cursor:pointer}
#mChars{left:max(12px,env(safe-area-inset-left))}
#mSabres{right:max(12px,env(safe-area-inset-right));background:linear-gradient(180deg,#4a4850,#26242a);border-color:#8a8f9a;box-shadow:0 4px 0 #0e0a0b,0 8px 20px rgba(0,0,0,.4)}
#mCtl{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px #000;text-align:center;width:min(62vw,640px);line-height:1.5}
@media (max-width:640px){#mCtl{display:none}#mPlay{font-size:26px;padding:11px 44px}}
</style>

function fmt(ms){
  var m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60, c=Math.floor(ms/10)%100;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+(c<10?'0':'')+c;
}
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}


/* =====================================================================
   SDK CrazyGames v3 (ne fait rien hors de CrazyGames, ex. test en local)
   ===================================================================== */
var cgMute=false;
var CG={
  sdk:null, ready:false,
  init:function(done){
    var fin=false, end=function(){ if(fin) return; fin=true; done(); };
    setTimeout(end,4000);
    try{
      var S=window.CrazyGames && window.CrazyGames.SDK;
      if(!S){ end(); return; }
      S.init().then(function(){
        try{
          if(S.environment==='crazygames'||S.environment==='local'){
            CG.sdk=S; CG.ready=true;
            var g=S.game;
            if(g && g.settings) cgMute=!!g.settings.muteAudio;
            if(g && g.addSettingsChangeListener) g.addSettingsChangeListener(function(st){ cgMute=!!(st&&st.muteAudio); });
          }
        }catch(e){}
        end();
      }).catch(end);
    }catch(e){ end(); }
  },
  call:function(f){ if(!CG.ready) return; try{ f(CG.sdk); }catch(e){} },
  loadingStart:function(){ CG.call(function(S){ S.game.loadingStart(); }); },
  loadingStop:function(){ CG.call(function(S){ S.game.loadingStop(); }); },
  start:function(){ CG.call(function(S){ S.game.gameplayStart(); }); },
  stop:function(){ CG.call(function(S){ S.game.gameplayStop(); }); },
  happy:function(){ CG.call(function(S){ S.game.happytime(); }); },
  ad:function(onStart,onEnd){
    var fired=false; var end=function(){ if(fired) return; fired=true; onEnd(); };
    if(!CG.ready){ end(); return; }
    try{ CG.sdk.ad.requestAd('midgame',{adStarted:onStart,adFinished:end,adError:end}); }catch(e){ end(); }
  }
};
/* Sauvegarde : module Data de CrazyGames (synchronisé au compte), sinon stockage du navigateur */
var Store={
  get:function(k){
    try{ if(CG.ready && CG.sdk.data) return CG.sdk.data.getItem(k); }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  set:function(k,v){
    try{ if(CG.ready && CG.sdk.data){ CG.sdk.data.setItem(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

/* =====================================================================
   Audio (WebAudio, aucun fichier externe)
   ===================================================================== */
var AC=null, muted=false, adMute=false, MASTER=null, MUSB=null, NBUF=null, SFXLAST={};
function initAudio(){
  try{
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(C){ AC=new C();
      // bus maître : compresseur doux (évite la saturation quand plusieurs sons se superposent) + volume général
      var comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.18;
      MASTER=AC.createGain(); MASTER.gain.value=0.9; MASTER.connect(comp); comp.connect(AC.destination);
      MUSB=AC.createGain(); MUSB.gain.value=0.55; MUSB.connect(MASTER);
      // bruit blanc pré-calculé une seule fois (plus de création de tampon à chaque son)
      var n=AC.sampleRate*2; NBUF=AC.createBuffer(1,n,AC.sampleRate); var a=NBUF.getChannelData(0); for(var i=0;i<n;i++) a[i]=Math.random()*2-1; } }
    if(AC && AC.state==='suspended') AC.resume();
  }catch(e){}
}
function silent(){ return muted||adMute||cgMute||!AC; }
// limite les répétitions trop rapprochées d'un même son (ex. plusieurs pièces dans la même image)
function gate(k,gap){ var t=AC.currentTime; if(SFXLAST[k]&&t-SFXLAST[k]<gap) return false; SFXLAST[k]=t; return true; }
function vr(x,k){ return x*(1+(Math.random()-0.5)*k); }
function note(f,d,type,v,f2,delay,dest){
  if(silent()) return;
  try{
    var t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+Math.min(0.006,d*0.2)); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g); g.connect(dest||MASTER); o.start(t0); o.stop(t0+d+0.03);
  }catch(e){}
}
// bruit filtré : type de filtre, fréquence (avec glissement optionnel), résonance, enveloppe
function noise(d,v,ft,f,f2,q,delay,dest,att){
  if(silent()) return;
  try{
    var t0=AC.currentTime+(delay||0), s=AC.createBufferSource(), g=AC.createGain(), fl=AC.createBiquadFilter();
    s.buffer=NBUF; fl.type=ft||'lowpass'; fl.frequency.setValueAtTime(f||6000,t0); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t0+d); fl.Q.value=q||0.8;
    var a=att||0.004; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    s.connect(fl); fl.connect(g); g.connect(dest||MASTER); s.start(t0,Math.random()*1.5); s.stop(t0+d+0.05);
  }catch(e){}
}
// cloche métallique : partiels inharmoniques (tintement de sabre, pièce, gong)
function bell(f,d,v,parts,delay,dest){ for(var i=0;i<parts.length;i++) note(f*parts[i][0],d*parts[i][2],'sine',v*parts[i][1],null,delay,dest); }
var COINP=[0,2,4,7,9,12,14,16], coinStep=0, coinT=0;
var sfx={
  // pièce : double tintement clair, la hauteur monte quand on enchaîne les pièces (gamme pentatonique)
  coin:function(){ if(silent()||!gate('coin',0.045)) return; var now=AC.currentTime; coinStep=(now-coinT<0.55)?Math.min(COINP.length-1,coinStep+1):0; coinT=now;
    var f=1046*Math.pow(2,COINP[coinStep]/12);
    bell(f,0.22,0.05,[[1,1,1],[2.76,0.35,0.6],[5.4,0.15,0.35]]); bell(f*1.5,0.3,0.045,[[1,1,1],[2.76,0.3,0.5]],0.055); },
  // saut : souffle d'air qui monte + froissement de tissu
  jump:function(){ noise(0.22,0.12,'bandpass',vr(700,0.2),2600,1.2); noise(0.12,0.05,'highpass',3000,null,0.7,0.02); note(vr(180,0.1),0.12,'sine',0.05,320); },

/* musique : ambiance japonaise (taiko, shime-daiko, koto en gamme miyako-bushi), tempo qui suit la vitesse de course */
var MSC=[293.7,311.1,392,440,466.2,587.3,622.3,784], mStep=0, mNext=0;
var KOTO=[0,2,3,4,3,2,0,-1, 5,4,3,4,2,3,1,-1, 0,3,4,6,5,4,3,-1, 2,4,3,2,1,0,1,-1];
function koto(f,t,v){ var o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), fl=AC.createBiquadFilter();
  o.type='triangle'; o2.type='sine'; o.frequency.value=f; o2.frequency.value=f*2.01; fl.type='lowpass'; fl.frequency.setValueAtTime(f*8,t); fl.frequency.exponentialRampToValueAtTime(f*1.5,t+0.6);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
  o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(MUSB); o.start(t); o2.start(t); o.stop(t+1); o2.stop(t+1); }
function taiko(t,v){ var o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(48,t+0.35);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45); o.connect(g); g.connect(MUSB); o.start(t); o.stop(t+0.5); }
setInterval(function(){
  if(state!=='play'||silent()){ mNext=0; return; }
  var now=AC.currentTime; if(!mNext||mNext<now) mNext=now+0.05;
  // tempo : 92 BPM au départ, jusqu'à ~124 BPM à vitesse maximale (doubles-croches)
  var bpm=92+32*clamp((SPEED-SPEED0)/(SPEEDMAX-SPEED0),0,1)+(boostT>0?10:0), st=60/bpm/4;
  while(mNext<now+0.12){ var t=mNext, k=mStep%32, b=mStep%16;
    try{
      if(b===0||b===10) taiko(t,0.22); if(b===6||b===14) taiko(t,0.12);
      if(k%2===0) noise(0.05,b%4===0?0.035:0.018,'bandpass',4200,null,2,t-now,MUSB);
      if(b===4||b===12){ noise(0.09,0.05,'bandpass',1800,null,1.5,t-now,MUSB); }
      if(k%2===0){ var n=KOTO[(k>>1)+((mStep>>5)%2)*16]; if(n!==undefined&&n>=0) koto(MSC[n]*(mStep%64<32?1:0.5)*(n>5?0.5:1),t,0.05); }
    }catch(e){}
    mStep++; mNext+=st; }
},40);

/* =====================================================================
   Génération du monde : des "rangées" d'obstacles, toujours franchissables
   kinds : 0 libre · 1 bloquant (changer de voie) · 2 sauter · 3 glisser · 4 sauter OU glisser
   ===================================================================== */
var CANVAS_COL=['#2b4c7e','#a3322b','#c58b2a','#3d6b45','#6b4a8a'];

function speedAt(d){ return SPEED0+(SPEEDMAX-SPEED0)*(1-Math.exp(-d/1700)); }
function addCoin(lane,z,y){ objs.push({t:'coin',lane:lane,x:(lane-1)*LANE,z1:z,z2:z,z:z,y:y,got:false}); }
function addObs(t,lane,z,len,extra){
  var o={t:t,lane:lane,x:(lane-1)*LANE,z1:z,z2:z+len};
  if(extra) for(var k in extra) o[k]=extra[k];
  objs.push(o); if(G3) G3.addObj(o); return o;
}
function addTrain(lane,z,len){ return addObs('train',lane,z,len,{ci:ri(CANVAS_COL.length)}); }

function spawnRow(){
  var z=nextZ, l, r, L=levelAt(z), opts=[];
  // la voie "libre" de cette rangée est voisine de celle de la rangée précédente
  for(l=0;l<=2;l++) if(L>=4||Math.abs(l-safeLane)<=1) opts.push(l); // niveau 4+ : la voie libre peut sauter de 2 voies
  safeLane=opts[ri(opts.length)];
  var calm=Math.random()<[0.2,0.08,0.03,0,0][L-1];
  var rowLen=2, kinds=[0,0,0], len=[0,0,0], jumpObs=[null,null,null];
  for(l=0;l<3;l++){
    if(calm) continue;
    r=Math.random();
    var ps=[0.2,0.38,0.55,0.7,0.85][L-1], pc=[0.45,0.56,0.66,0.74,0.82][L-1];
    if(l===safeLane) kinds[l]= r<ps/3?2 : (r<ps*2/3?3 : (r<ps?4:0));
    else kinds[l]= r<pc?1 : (r<pc+(1-pc)*0.3?2 : (r<pc+(1-pc)*0.6?3 : (r<pc+(1-pc)*0.88?4:0)));
    if(L<2 && kinds[l]===4) kinds[l]=2; // la corde sacrée arrive au niveau 2
  }
  for(l=0;l<3;l++){
    var k=kinds[l];
    if(k===1){
      if(L>=2 && Math.random()<0.25){ addObs('crates',l,z,1.8); len[l]=1.8; }
      else {
        var c1=rnd(4.5,7); addTrain(l,z,c1); len[l]=c1;
        if(Math.random()<[0.15,0.32,0.5,0.65,0.8][L-1]){ var c2=rnd(4.5,7); addTrain(l,z+c1+1.2,c2); len[l]=c1+1.2+c2; }
      }
      rowLen=Math.max(rowLen,len[l]);
    }
    else if(k===4) jumpObs[l]=addObs('mid',l,z,0.4);
    else if(k===2){
      var v=Math.random();
      if(L>=3 && v<0.3) jumpObs[l]=addObs('spikes',l,z,1.6);
      else if(v<0.62) jumpObs[l]=addObs('low',l,z,1.2);
      else jumpObs[l]=addObs('crate',l,z,1.0);
    }
    else if(k===3) addObs('high',l,z,1.2);
  }
  // tonneaux qui roulent vers le joueur (obstacles mobiles, à sauter) à partir du niveau 2
  if(L>=2 && !calm){
    for(l=0;l<3;l++) if(kinds[l]===0 && Math.random()<[0,0.2,0.3,0.38,0.46][L-1]) addObs('barrel',l,z+rnd(3,9),0.9,{roll:0});
  }
  // pièces dans la voie libre (en arc au-dessus d'un obstacle à sauter)
  var cEnd=z+Math.max(rowLen,4), cz, y, dz, jo=jumpObs[safeLane], jc=jo?(jo.z1+jo.z2)/2:0;
  for(cz=z-2;cz<=cEnd;cz+=2.4){
    y=0.95;
    if(jo){ dz=cz-jc; if(Math.abs(dz)<6.5) y=0.95+1.25*(1-(dz*dz)/(6.5*6.5)); }
    addCoin(safeLane,cz,y);
  }
  // quelques pièces dans les voies vides
  for(l=0;l<3;l++){
    if(l!==safeLane && kinds[l]===0 && Math.random()<0.45){
      for(cz=z;cz<=z+Math.max(rowLen,6);cz+=2.4) addCoin(l,cz,0.95);
    }
  }
  var gmin=Math.max([30,26,22,19,17][L-1],speedAt(z)*0.66);
  nextZ=z+rowLen+rnd(gmin,gmin+[14,10,8,6,5][L-1]);
}

/* =====================================================================
   Gestion des états
   ===================================================================== */
function resetGame(){
  SPEED=SPEED0; lvl=1; lvlT=-1; sabreT=0; var sb0=curSabre(); sabreLeft=sb0?sb0.charges:0; spk.length=0;
  prevBest=best; recordShown=false; recT=-1; celebrate=false; celT=-1;
  if(G3) G3.clearObjs(objs);
  dist=0; elapsed=0; coinCount=0; score=0; newBest=false; objs.length=0; safeLane=1;
  nextZ=70; overT=0; shake=0; flash=0;
  var p=player; p.lane=1; p.x=0; p.vx=0; p.y=0; p.vy=0; p.ground=true; p.slide=0; p.roll=false; p.phase=0; p.cr=Math.random()<0.5?-1:1;
  p.jbuf=0; p.air=0; p.jumpN=0; p.stumble=0; p.land=0;

function blockedAt(l){

function act(a){
  if(state!=='play') return;
  var p=player;
  if(a==='left'||a==='right'){
    var d=a==='left'?-1:1, nl=p.lane+d;
    if(nl<0||nl>2) return;

    p.lane=nl; sfx.move();

  } else if(a==='down'){
    if(p.ground){ p.slide=p.slide0=0.62; sfx.roll(); }
    else { p.vy=Math.min(p.vy,-30); p.roll=true; p.jbuf=0; }
  }

/* =====================================================================
   Mise à jour
   ===================================================================== */
function breakBarrel(o){ o.broke=true; sfx.smash(); if(G3) G3.breakObj(o); }
function update(dt){
  var p=player, i, o;
  elapsed+=dt*1000;
  if(sabreT>0) sabreT=Math.max(0,sabreT-dt);
  var nl=levelAt(dist);
  if(nl!==lvl){ lvl=nl; lvlT=0; sfx.level(); }
  // vitesse : montée continue et douce, plafonnée
  // progression douce : ~26 m/s au niveau 2, ~33 au 3, ~40 au 4, ~44 au 5, puis tend vers 50 m/s sans jamais le dépasser
  var tgt=speedAt(dist);
  SPEED+=(tgt-SPEED)*Math.min(1,dt*1.5);
  // boost : se recharge en 30 s de course, puis sprint ultra rapide de 4 s (invincible)
  if(boostT>0){ boostT=Math.max(0,boostT-dt); shake=Math.max(shake,0.07); if(boostT===0) graceT=1.0; }
  else { if(graceT>0) graceT=Math.max(0,graceT-dt); if(boostCharge<1){ boostCharge=Math.min(1,boostCharge+dt/30); if(boostCharge>=1){ boostBannerT=0; sfx.boostReady(); } } }
  boostMul+=((boostT>0?1.9:1)-boostMul)*Math.min(1,dt*(boostT>0?5:2.5));
  dist+=SPEED*boostMul*dt;
  score=Math.floor(dist)+coinCount*10;
  // nouveau record : détecté une seule fois, au moment exact où le score dépasse l'ancien record
  if(!recordShown && prevBest>0 && score>prevBest){ recordShown=true; recT=0; celT=0; sfxRec(); burst(W/2,Math.min(H*0.3,90),70,520); if(G3) G3.celebrate(); }
  while(nextZ<dist+FAR) spawnRow();

  // changement de voie fluide (ressort amorti)
  var tx=(p.lane-1)*LANE, k=1-Math.exp(-dt*(17+lvl)), nx=p.x+(tx-p.x)*k;
  if(Math.abs(tx-nx)<0.01) nx=tx;
  p.vx=(nx-p.x)/dt; p.x=nx;
  if(!p.ground){
    p.air+=dt;
    p.vy-=GRAV*dt; p.y+=p.vy*dt;
    if(p.jbuf>0) p.jbuf-=dt;
    if(p.y<=0){
      p.y=0; p.vy=0; p.ground=true; p.land=0.14;
      if(p.roll){ p.slide=p.slide0=0.5; p.roll=false; sfx.roll(); }
      else if(p.jbuf>0) doJump();
      else sfx.land();
    }
  }
  if(p.slide>0) p.slide=Math.max(0,p.slide-dt);
  if(p.stumble>0) p.stumble=Math.max(0,p.stumble-dt);
  if(p.land>0) p.land=Math.max(0,p.land-dt);
  var sp0=Math.sin(p.phase); p.phase+=dt*(12+SPEED*boostMul*0.25);
  if(p.ground&&p.slide<=0&&(sp0<0)!==(Math.sin(p.phase)<0)) sfx.step(clamp((SPEED-SPEED0)/(SPEEDMAX-SPEED0),0,1));
  var ph=p.slide>0?0.75:1.9;

  // les tonneaux roulent vers le joueur et éclatent contre un obstacle
  for(i=0;i<objs.length;i++){
    o=objs[i]; if(o.t!=='barrel'||o.cut||o.broke||o.z1-dist>60) continue;
    var nz=o.z1-10*dt, blk=false;
    for(var j=0;j<objs.length;j++){ var q=objs[j]; if(q===o||q.t==='coin'||q.lane!==o.lane||q.cut||q.broke) continue;
      if(q.z2<=o.z1+0.01 && q.z2>nz-0.15){ blk=true; break; } }
    if(blk) breakBarrel(o);
    else { o.z1=nz; o.z2=nz+0.9; o.roll+=10*dt/0.45; }
  }
  var w=0;
  for(i=0;i<objs.length;i++){
    o=objs[i];
    if(o.t==='coin'){
      if(!o.got && Math.abs(o.z-dist)<(boostT>0?1.6:0.9) && Math.abs(o.x-p.x)<(boostT>0?3.6:0.95) && (boostT>0 || (o.y>p.y-0.25 && o.y<p.y+ph+0.25))){
        o.got=true; coinCount++; bump=1; sfx.coin(); if(G3) G3.coinPop(o);
      }
    } else if(!o.cut && !o.broke && o.z1<dist+0.55 && o.z2>dist-0.55){
      var t=o.t, blockT=(t==='train'||t==='crates'), hw=blockT?0.92:(t==='barrel'?0.72:0.95);
      if(Math.abs(o.x-p.x)<0.33+hw){
        if(blockT) hit(o);
        else if(t==='low'||t==='crate'||t==='barrel'){ if(p.y<0.8) hit(o); }
        else if(t==='spikes'){ if(p.y<0.6) hit(o); }
        else if(t==='mid'){ if(p.y<1.0 && p.y+ph>0.85) hit(o); }
        else if(p.y<2.2 && p.y+ph>1.2) hit(o);
      }
    }
    if(!o.got && o.z2>dist-12) objs[w++]=o;
    else if(G3 && o.t!=='coin') G3.removeObj(o);
  }
  objs.length=w;
}

function tick(dt){
  tAnim+=dt;
  bump=Math.max(0,bump-dt*4);
  if(recT>=0) recT+=dt;
  if(celT>=0&&!DBG.hold){ celT+=dt; if(celT>2.6||state==='menu') celT=-1; }
  if(boostBannerT>=0){ boostBannerT+=dt; if(boostBannerT>1.8) boostBannerT=-1; }
  if(lvlT>=0) lvlT+=dt;
  if(state==='play'){
    var r=dt, s; if(hitStop>0){ hitStop-=dt; r=dt*0.2; }
    // léger ralenti pendant la célébration (les animations du ninja restent en temps réel)
    if(celT>=0&&celT<1.9) r*=1-0.55*(celT<0.25?celT/0.25:(celT<1.4?1:1-(celT-1.4)/0.5));
    while(r>0 && state==='play'){ s=Math.min(r,1/120,0.35/Math.max(1,SPEED*boostMul)); update(s); r-=s; }
  } else if(state==='over'){
    overT+=dt; shake=Math.max(0,shake-dt*2.2); flash=Math.max(0,flash-dt*2.5);
    if(overT>2.4 && uiMode!=='over' && !busy) showUI('over');
  } else if(state==='intro'){
    introT+=dt; player.phase+=dt*19;
    if(introT>0.85){ var kx=Math.min(1,(introT-0.85)/0.45); player.x=MENU_X*(1-kx*kx*(3-2*kx)); }
    if(introT>=1.3){ state='play'; introT=-1; CG.start(); }
  } else if(state==='menu'){
    dist=0; player.phase+=dt*13; player.x=MENU_X;
  }
  if(state!=='over') shake=Math.max(0,shake-dt*2.5);
}

function limb3(g,x1,y1,x2,y2,r1,r2,c){

      'float pW=uWind*1.15+oW.x*0.19+oW.y*0.13; float gW=0.65+0.35*sin(uWind*0.37+oW.x*0.05);\n'+
      'transformed.x+=sin(pW)*bW*gW; transformed.z+=cos(pW*0.8)*bW*gW*0.6;'); };

    if(hs(sd+12)<0.45){ m=BUSHES[Math.floor(hs(sd+13)*BUSHES.length)].g.clone(); m.position.set(side*(6.6+hs(sd+14)*0.6),0,-(z0+hs(sd+15)*20)); list.push(m); }

  var w=0, i, d;
  for(i=0;i<debris.length;i++){ d=debris[i]; d.t+=dt;
    if(d.t>d.life){ killDebris(d); continue; }
    if(d.kind==='half'){

      _v.copy(d.c).add(d.off); d.pl.setFromNormalAndCoplanarPoint(d.sn,_v);
    } else if(d.kind==='shard'){

    }

  debris.length=w;
  w=0;
  for(i=0;i<flashes.length;i++){ var f=flashes[i]; f.t+=dt; if(f.t>0.3){ scene.remove(f.m); if(!f.arc) f.m.geometry.dispose(); f.m.material.dispose(); continue; }
    f.m.material.opacity=1-f.t/0.3;
    if(f.arc){ var ka=0.7+f.t*1.6; f.m.scale.set(ka,ka,1); f.m.rotation.z-=dt*9; }
    else f.m.scale.set(1+f.t*4,Math.max(0.05,1-f.t*2.5),1); flashes[w++]=f; }
  flashes.length=w;
  w=0;

    var bl=Math.max(0,Math.sin(tAnim*2.2+ph2*3.1)); bl=bl*bl; fc[i]=1.0*bl; fc[i+1]=0.82*bl; fc[i+2]=0.38*bl; }
  flies.geometry.attributes.position.needsUpdate=true; flies.geometry.attributes.color.needsUpdate=true;
  // sabre actif : aura + tourbillon lumineux
  var sb=curSabre(), act=sb&&sabreT>0&&state==='play';
  tickTrail(act||atkT>=0||(celT>=0&&celT<2.2));

  tickStreaks(dt,state==='play'?(boostT>0?1:(SPEED>40?(SPEED-40)/30:0)):0); tickRibbons(dt,boostT>0&&state==='play');
  if(hero) hero.root.visible=!(graceT>0&&state==='play'&&Math.floor(tAnim*18)%2===0);

  var cAct=state==='play'&&celT>=0&&celT<2.2;

  if(cAct){ aura.material.color.set('#ffb347'); aura.position.set(p.x,1.1+p.y,-dist); var as=1+0.15*Math.sin(tAnim*12); aura.scale.set(as,as*1.15,as); } else aura.scale.set(1,1,1);

var SL=[]; for(var sli=0;sli<40;sli++) SL.push({a:Math.random()*6.2832,r:Math.random(),v:0.6+Math.random()*0.8});
function drawSpeedLines(){
  if(state!=='play'||(SPEED<27&&boostMul<1.05)) return;
  var k=Math.max((SPEED-27)/(SPEEDMAX-27),(boostMul-1)*1.8), cx=W/2, cy=H*0.42, R=Math.hypot(W,H)*0.6;
  ctx.save(); ctx.lineCap='round';
  for(var i=0;i<SL.length;i++){ var l=SL[i]; l.r+=l.v*0.03*(0.6+k); if(l.r>1){ l.r=0.25; l.a=Math.random()*6.2832; }
    var r1=R*l.r, r2=R*(l.r+0.08+0.12*k), ca=Math.cos(l.a), sa=Math.sin(l.a);
    if(sa>0.55) continue; // pas de traits sur le ninja ni sur le chemin
    ctx.globalAlpha=Math.min(1,(l.r-0.25)*3)*0.16*k; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5+2*l.r;
    ctx.beginPath(); ctx.moveTo(cx+ca*r1,cy+sa*r1); ctx.lineTo(cx+ca*r2,cy+sa*r2); ctx.stroke(); }
  ctx.restore();
}
function drawSlashArc(){
  var k=tAnim-slashT; if(k<0||k>0.25||!G3) return;
  var sp=G3.toScreen(player.x,1.3+player.y,-dist), s=sp.s, a=1-k/0.25;
  ctx.save(); ctx.globalAlpha=a; ctx.lineCap='round';
  var sb=curSabre(); ctx.shadowColor=(sb&&sb.glow)||'#ffffff'; ctx.shadowBlur=20;
  ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=Math.max(2,s*0.08*a);
  ctx.beginPath(); ctx.arc(sp.x,sp.y,s*1.15,-2.8+k*4,-0.4+k*4); ctx.stroke();
  ctx.restore();
}

// petit kunai avec traits de vent (même emblème que le bouton BOOST)
function drawKunai(x,y,s,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s/60,s/60);
  ctx.lineCap='round'; ctx.strokeStyle='#ffd27a'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-50,-14); ctx.lineTo(-30,-14); ctx.moveTo(-58,0); ctx.lineTo(-40,0); ctx.moveTo(-50,14); ctx.lineTo(-30,14); ctx.stroke();
  ctx.strokeStyle='#2a0806'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(-25,0,6,0,6.2832); ctx.stroke();
  ctx.fillStyle='#b3121b'; ctx.fillRect(-19,-4,22,8);
  ctx.beginPath(); ctx.moveTo(40,0); ctx.lineTo(10,-11); ctx.lineTo(3,0); ctx.lineTo(10,11); ctx.closePath();
  ctx.fillStyle='#f1f3f7'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#2a0806'; ctx.stroke();
  ctx.restore();
}
function drawBoostBanner(){
  if(boostBannerT<0) return;
  var t=boostBannerT, fs=clamp(Math.min(W,H)*0.065,24,50), y=Math.min(H*0.5,fs*7.2), sc=t<0.3?0.4+0.6*Math.sin(t/0.3*Math.PI/2)*1.1:1, al=t>1.4?1-(t-1.4)/0.4:1;
  ctx.save(); ctx.globalAlpha=Math.max(0,al); ctx.translate(W/2,y); ctx.scale(sc,sc); ctx.rotate(Math.sin(t*10)*0.03);
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='900 '+fs+'px "Trebuchet MS",system-ui,sans-serif';
  var tw=ctx.measureText(TX.boostReady).width;
  ctx.lineJoin='round'; ctx.lineWidth=fs*0.22; ctx.strokeStyle='#2a0806'; ctx.strokeText(TX.boostReady,0,0);
  var g=ctx.createLinearGradient(0,-fs/2,0,fs/2); g.addColorStop(0,'#fff1c8'); g.addColorStop(0.55,'#ffb347'); g.addColorStop(1,'#e0431f'); ctx.fillStyle=g; ctx.fillText(TX.boostReady,0,0);
  var ko=Math.min(1,t/0.3); drawKunai(-tw/2-fs*1.1-(1-ko)*fs,0,fs*0.9,0); drawKunai(tw/2+fs*1.1+(1-ko)*fs,0,fs*0.9,Math.PI);
  ctx.restore();

// icône de pièce percée (identique aux pièces du jeu)
function drawCoinIcon(x,y,r){
  var g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r); g.addColorStop(0,'#ecd0a2'); g.addColorStop(0.55,'#b9844c'); g.addColorStop(1,'#6e4422');
  ctx.fillStyle='#3e2410'; ctx.beginPath(); ctx.arc(x,y+r*0.08,r,0,6.2832); ctx.fill();
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  ctx.lineWidth=Math.max(1,r*0.12); ctx.strokeStyle='rgba(94,56,24,.9)'; ctx.beginPath(); ctx.arc(x,y,r*0.8,0,6.2832); ctx.stroke();
  var q=r*0.26; ctx.fillStyle='#2a1a06'; ctx.fillRect(x-q,y-q,q*2,q*2); ctx.lineWidth=Math.max(1,r*0.09); ctx.strokeStyle='#8a5a2c'; ctx.strokeRect(x-q-r*0.06,y-q-r*0.06,q*2+r*0.12,q*2+r*0.12);
  ctx.fillStyle='rgba(255,240,220,.18)'; ctx.beginPath(); ctx.ellipse(x-r*0.38,y-r*0.42,r*0.28,r*0.12,-0.6,0,6.2832); ctx.fill();
}
var coinFloat=[], lastCoinShown=0;
function drawCoinCounter(xr,cy,cs){
  if(coinCount!==lastCoinShown){ if(coinCount>lastCoinShown&&state==='play') coinFloat.push({t:0}); lastCoinShown=coinCount; }
  var ct=String(coinCount), fz=Math.round(cs*0.95);
  ctx.save(); ctx.font='900 '+fz+'px "Trebuchet MS",system-ui,sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='center';
  // chiffres à chasse fixe : le nombre ne « tremble » pas quand il change
  var dw=ctx.measureText('0').width*1.02, nd=Math.max(2,ct.length), tw=dw*nd, ir=cs*0.46, pw=tw+ir*2+cs*0.95, phh=cs*1.42, x0=xr-pw;
  var bg=ctx.createLinearGradient(0,cy-phh/2,0,cy+phh/2); bg.addColorStop(0,'rgba(36,26,28,.88)'); bg.addColorStop(1,'rgba(14,10,12,.88)');
  ctx.fillStyle=bg; rr(x0,cy-phh/2,pw,phh,phh/2); ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(232,176,74,'+(0.45+bump*0.4)+')'; rr(x0+0.75,cy-phh/2+0.75,pw-1.5,phh-1.5,phh/2); ctx.stroke();
  // icône : légère pulsation à chaque pièce
  var ix=x0+phh/2+ir*0.15, sc=1+bump*0.16;
  if(bump>0.05){ var hg=ctx.createRadialGradient(ix,cy,0,ix,cy,ir*2.2); hg.addColorStop(0,'rgba(255,210,110,'+(bump*0.45)+')'); hg.addColorStop(1,'rgba(255,210,110,0)'); ctx.fillStyle=hg; ctx.fillRect(ix-ir*2.2,cy-ir*2.2,ir*4.4,ir*4.4); }
  ctx.save(); ctx.translate(ix,cy); ctx.scale(sc,sc); ctx.translate(-ix,-cy); drawCoinIcon(ix,cy,ir); ctx.restore();
  // nombre (aligné à droite, chaque chiffre centré dans sa case)
  var nx=xr-cs*0.42-tw, k=bump;
  ctx.fillStyle=k>0.05?'rgb(255,'+Math.round(255-k*40)+','+Math.round(255-k*150)+')':'#fff6e8';
  for(var i=0;i<ct.length;i++) ctx.fillText(ct.charAt(i),nx+dw*(nd-ct.length+i)+dw/2,cy+1);
  // « +1 » qui s'élève et s'efface
  var w=0; for(i=0;i<coinFloat.length;i++){ var f=coinFloat[i]; f.t+=1/60; if(f.t>0.6) continue; coinFloat[w++]=f;
    ctx.globalAlpha=1-f.t/0.6; ctx.font='900 '+Math.round(cs*0.5)+'px "Trebuchet MS",system-ui,sans-serif'; ctx.fillStyle='#ffd27a'; ctx.fillText('+1',ix,cy+phh*1.05-f.t*cs*1.1); }
  coinFloat.length=Math.min(w,4); ctx.restore();
}
function drawHUD(){

  var dtxt=Math.floor(dist)+' m'; ctx.strokeText(dtxt,W/2,py+ph+fs*0.32); ctx.fillText(dtxt,W/2,py+ph+fs*0.32);

/* =====================================================================

function frame(ts){
  window.requestAnimationFrame(frame);
  if(!last) last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(!(dt>0)) dt=0; if(dt>0.1) dt=0.1;
  tick(dt);
  if(G3){ G3.render(dt); G3.perf(dt); }
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  drawSpeedLines(); drawSlashArc();
  if(flash>0){ ctx.fillStyle=(celebrate?'rgba(255,200,40,':'rgba(209,52,47,')+(flash*0.45)+')'; ctx.fillRect(0,0,W,H); }
  drawHUD();
  if(state==='play'||state==='over'){ drawRecordBanner(); if(state==='play') drawLevelBanner(); }
  if(state==='play') drawBoostBanner();
  drawSparks(dt); drawMenuPreviews(); tickFx(dt); updateSabreBtn(); updateBoostBtn();
}
